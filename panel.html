<!doctype html>
<html lang="en">
<link rel="stylesheet" href="panel.css">

<body>
  <div class="header">
    <div class="row1">
      <div class="searchbox">
        <svg class="searchicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.25 4.25c-3.314 0-6 2.686-6 6s2.686 6 6 6c1.657 0 3.155-.67 4.243-1.757 1.087-1.088 1.757-2.586 1.757-4.243 0-3.314-2.686-6-6-6zm-9 6c0-4.971 4.029-9 9-9s9 4.029 9 9c0 1.943-.617 3.744-1.664 5.215l4.475 4.474-2.122 2.122-4.474-4.475c-1.471 1.047-3.272 1.664-5.215 1.664-4.971 0-9-4.029-9-9z"/></svg>
        <input class="search" placeholder="Search">
      </div>
      <div class="prefixfield" tabindex="0" role="button" aria-haspopup="listbox"><span class="prefixlabel">all prefixes</span></div>
    </div>
    <div class="row2 filters">
      <div class="bulk">
        <button class="bulkbtn danger" data-bulk="on">all on</button>
        <button class="bulkbtn danger" data-bulk="off">all off</button>
        <button class="bulkbtn" data-bulk="reset">reset</button>
        <button class="bulkbtn" data-upsell="off">slop off</button>
        <button class="bulkbtn" data-upsell="on">slop on</button>
        <button class="bulkbtn" data-isolate="start">isolate</button>
        <button class="bulkbtn" data-data="import">import</button>
        <button class="bulkbtn" data-data="export">export</button>
      </div>
    </div>
    <div class="flagrow">
      <span class="flagcount">??? flags</span>
      <span class="saveall" data-data="all">save as json</span>
      <span class="histbtns">
        <button class="histbtn" data-hist="undo" title="undo" aria-label="undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
        <button class="histbtn" data-hist="redo" title="redo" aria-label="redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
      </span>
    </div>
  </div>
  <div class="isolationbar" hidden></div>
  <div class="list"></div>
  <div class="devbar">
    <div class="row2 swrow"></div>
    <div class="row2 dev"></div>
  </div>
  <div class="footer">
    <span class="footermessage">You've got unsaved changes!</span>
    <button class="button undo">Undo</button>
    <button class="button hot reload">Save & reload</button>
  </div>
  <script src="panel.js"></script>
</body>
</html>
