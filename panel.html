<!doctype html>
<html lang="en">
<link rel="stylesheet" href="panel.css">
<body>

  <div class="header">
    <div class="row1">
      <div class="searchbox">
        <svg aria-hidden="true" class="searchicon" viewBox="0 0 24 24"><path d="M10.3 4.3a6 6 0 1 0 0 12 6 6 0 0 0 0-12m-9 6a9 9 0 1 1 16.3 5.2l4.5 4.4-2.2 2.2-4.4-4.5a9 9 0 0 1-14.2-7.3"/></svg>
        <input class="search" placeholder="Search">
      </div>
      <div class="prefixfield" tabindex="0" role="button" aria-haspopup="listbox"><span class="prefixlabel">all prefixes</span></div>
    </div>

    <div class="row2 filters"></div>

    <div class="row2 actions">
      <div class="btngroup">
        <button class="bulkbtn danger" data-bulk="on">all on</button>
        <button class="bulkbtn danger" data-bulk="off">all off</button>
        <button class="bulkbtn" data-bulk="reset">reset</button>
      </div>
      <div class="btngroup">
        <button class="bulkbtn" data-upsell="off">slop off</button>
        <button class="bulkbtn" data-upsell="on">slop on</button>
      </div>
      <div class="btngroup tools">
        <button class="iconbtn" data-isolate="start" title="isolation mode (in case you can't find a flag)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16m0-13a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/></svg>
        </button>
        <button class="iconbtn" data-presets title="presets" aria-label="presets">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2"/></svg>
        </button>
        <button class="iconbtn" data-data="import" title="import flag changes (.json)" aria-label="import">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20h14v-2H5zm7-16-7 7h4v6h6v-6h4z"/></svg>
        </button>
        <button class="iconbtn" data-data="export" title="export flag changes (.json)" aria-label="export">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>
        </button>
      </div>
    </div>
    <div class="flagrow">
      <span class="flagcount">??? flags</span>
      <span class="saveall" data-data="all">save as json</span>
      <span class="histbtns">
        <button class="histbtn" data-hist="undo" title="undo" aria-label="undo" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12.5 8q-4 .1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20 16l2.4-.8a10.5 10.5 0 0 0-10-7.2"/></svg>
        </button>
        <button class="histbtn" data-hist="redo" title="redo" aria-label="redo" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18.4 10.6a10.5 10.5 0 0 0-16.9 4.6L4 16a8 8 0 0 1 12.7-3.6L13 16h9V7z"/></svg>
        </button>
      </span>
    </div>
  </div>

  <div class="presetbar" hidden></div>
  <div class="isolationbar" hidden></div>
  <div class="list"></div>

  <div class="devbar">
    <div class="row2 swrow"></div>
    <div class="row2 dev"></div>
    <label class="checklabel synctoggle" data-sync hidden>
    <span class="checkbox"><svg aria-hidden="true" class="tick" viewBox="0 0 24 24"><path d="m9.6 19-5.5-5 1.3-1.4 4 3.4 8.4-10.9 1.6 1.2z"/></svg></span>sync extension data (chrome)</label>
  </div>

  <div class="footer">
    <span class="footermessage">You've got unsaved changes!</span>
    <button class="button undo">Undo</button>
    <button class="button hot reload">Save & reload</button>
  </div>
  <script src="panel.js"></script>

</body>
</html>
